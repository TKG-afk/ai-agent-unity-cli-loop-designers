<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIエージェントとUnity CLI Loopでデザイナーでもゲームが作れる！</title><link rel="stylesheet" href="styles.css"></head>
<body><main id="stage"><div id="slides"></div><footer><div id="ref" aria-hidden="true"></div><nav aria-label="スライド操作"><button id="prev" title="前のページ">←</button><span id="counter" aria-live="polite"></span><button id="next" title="次のページ">→</button><button id="toc">目次</button><button id="notes">メモ</button><button id="full">全画面</button></nav></footer><div id="progress"></div></main>
<dialog id="contents"><div class="dialog-head"><h2>目次</h2><button class="close">閉じる ×</button></div><label class="switch"><input type="checkbox" id="allSlides"> 補足も含めて順送りする</label><div id="tocList"></div></dialog>
<dialog id="noteDialog"><div class="dialog-head"><h2>講師用メモ</h2><button class="close">閉じる ×</button></div><div id="noteBody"></div><p><a href="teacher-notes.html" target="_blank">全ページのメモを別画面で開く</a></p></dialog><div id="toast" role="status"></div>
<script src="slides.js"></script><script src="app.js"></script></body></html>
